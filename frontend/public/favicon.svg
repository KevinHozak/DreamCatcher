<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2456"/>
      <stop offset="50%" stop-color="#191535"/>
      <stop offset="100%" stop-color="#0e0a22"/>
    </linearGradient>

    <!-- Metallic Lens Rim Gradients -->
    <linearGradient id="rimOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ba1b5"/>
      <stop offset="30%" stop-color="#2c3540"/>
      <stop offset="70%" stop-color="#6b8299"/>
      <stop offset="100%" stop-color="#141a22"/>
    </linearGradient>

    <linearGradient id="rimInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10151c"/>
      <stop offset="50%" stop-color="#3d4957"/>
      <stop offset="100%" stop-color="#10151c"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Outer Lens Rim -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#rimOuter)" stroke-width="18"/>
  <circle cx="256" cy="256" r="192" fill="#131821" stroke="#080a0f" stroke-width="3"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#rimInner)" stroke-width="12"/>
  <circle cx="256" cy="256" r="172" fill="#0b0e14"/>

  <!-- Stepped Lens Thread Ridges -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#26313d" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="256" cy="256" r="154" fill="none" stroke="#182029" stroke-width="3"/>
  <circle cx="256" cy="256" r="144" fill="#090d14"/>

  <!-- Aperture Iris Core -->
  <circle cx="256" cy="256" r="76" fill="#06080d" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Dreamcatcher Sacred Geometric Webbing (Cyan Layer) -->
  <g filter="url(#glowCyan)" stroke="#38d9ee" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="0.95">
    <ellipse cx="256" cy="256" rx="136" ry="68" transform="rotate(0 256 256)"/>
    <ellipse cx="256" cy="256" rx="136" ry="68" transform="rotate(30 256 256)"/>
    <ellipse cx="256" cy="256" rx="136" ry="68" transform="rotate(60 256 256)"/>
    <ellipse cx="256" cy="256" rx="136" ry="68" transform="rotate(90 256 256)"/>
    <ellipse cx="256" cy="256" rx="136" ry="68" transform="rotate(120 256 256)"/>
    <ellipse cx="256" cy="256" rx="136" ry="68" transform="rotate(150 256 256)"/>
  </g>

  <!-- Dreamcatcher Inner Webbing (Warm Amber Layer) -->
  <g filter="url(#glowAmber)" stroke="#f59e0b" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.9">
    <ellipse cx="256" cy="256" rx="100" ry="50" transform="rotate(15 256 256)"/>
    <ellipse cx="256" cy="256" rx="100" ry="50" transform="rotate(45 256 256)"/>
    <ellipse cx="256" cy="256" rx="100" ry="50" transform="rotate(75 256 256)"/>
    <ellipse cx="256" cy="256" rx="100" ry="50" transform="rotate(105 256 256)"/>
    <ellipse cx="256" cy="256" rx="100" ry="50" transform="rotate(135 256 256)"/>
    <ellipse cx="256" cy="256" rx="100" ry="50" transform="rotate(165 256 256)"/>
  </g>

  <!-- Central Camera Aperture Blades -->
  <g stroke="#38bdf8" stroke-width="2" fill="#0f172a" opacity="0.95">
    <path d="M 256 216 Q 284 228 290 256 L 256 256 Z"/>
    <path d="M 290 256 Q 284 284 256 296 L 256 256 Z"/>
    <path d="M 256 296 Q 228 284 222 256 L 256 256 Z"/>
    <path d="M 222 256 Q 228 228 256 216 L 256 256 Z"/>
  </g>

  <!-- Glowing Center Pupil Node -->
  <circle cx="256" cy="256" r="14" fill="#030712" stroke="#38d9ee" stroke-width="3"/>
  <circle cx="256" cy="256" r="5" fill="#fef08a"/>
</svg>