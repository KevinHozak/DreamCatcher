[package]
name = "dreamcatcher"
version = "1.9.1"
description = "DreamCatcher - Local AI Photo Triage Cockpit"
authors = ["Kevin Hozak"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "dreamcatcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp"] }
heic = { version = "0.1.6", default-features = false, features = ["std"] }
exif = { package = "kamadak-exif", version = "0.6" }
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
regex = "1.10"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
percent-encoding = "2.3"
rusqlite = { version = "0.32", features = ["bundled"] }
